<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dce7ef" />
    <title>粉晶花 · 手机梦境预览</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/phone-preview.css" />
  </head>
  <body>
    <main class="phone-preview">
      <section
        id="phone-shell"
        class="phone-shell"
        role="button"
        tabindex="0"
        aria-label="点击或轻触，让粉色水晶花旋转盛开"
      >
        <img
          class="phone-background"
          src="./assets/phone-dream-background.jpg"
          alt=""
          draggable="false"
        />
        <img
          class="phone-fallback"
          src="./assets/pink-alpha-frames/pink-alpha-000.webp"
          alt=""
          draggable="false"
        />
        <canvas id="phone-flower" aria-hidden="true"></canvas>

        <div class="tap-cue" aria-hidden="true">
          <span></span>
          <p>轻触 · 唤醒粉晶花</p>
        </div>

        <div class="phone-status">
          <i aria-hidden="true"></i>
          <p id="phone-load-status" role="status" aria-live="polite">正在准备花瓣…</p>
        </div>
      </section>
    </main>

    <script type="module" src="./src/phone-preview.mjs"></script>
  </body>
</html>
